# render.yaml — Infrastructure as Code for Render.com
# Docs: https://render.com/docs/render-yaml-spec
#
# Deploy both services at once:
#   1. Push this file to your repo
#   2. Go to Render Dashboard → New → Blueprint
#   3. Connect your repo — Render will auto-detect this file

services:
  # ─── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: embedai-backend
    runtime: node
    rootDir: backend
    buildCommand: NODE_ENV=development npm install --legacy-peer-deps && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard (sensitive)
      - key: JWT_ACCESS_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Set manually to the frontend's public URL (e.g., https://embedai-frontend.onrender.com)
      - key: ALLOWED_ORIGINS
        sync: false  # Set manually to the frontend's public URL
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: embedai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true  # Render builds preview URLs for PRs
    headers:
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set manually to the backend's public URL (e.g., https://embedai-backend.onrender.com)
      - key: VITE_SOCKET_URL
        sync: false  # Set manually to the backend's public URL
